name: Radar - coletar vagas

on:
  schedule:
    - cron: "0 9,21 * * *"   # 06:00 e 18:00 em Brasília (UTC-3)
  workflow_dispatch:          # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: radar-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar testes
        run: python -m pytest -q

      - name: Coletar vagas
        run: python -m radar.main

      - name: Gravar resultado no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/data/radar/jobs.json
          git diff --cached --quiet || git commit -m "chore(radar): atualiza vagas"
          git push
